version: "3.9"

services:
  # ── 应用服务 ─────────────────────────────────────────────────────────────
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: bill_rag_app
    ports:
      - "8000:8000"
    environment:
      # 服务地址：docker 内部使用服务名，覆盖 .env 中的 localhost 配置
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/bill_rag
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      - REDIS_URL=redis://redis:6379/0
      # LLM：从宿主机环境变量读取（本地先 export OPENAI_API_KEY=xxx）
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-qwen-max}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      # 视觉模型
      - VISION_ENABLED=${VISION_ENABLED:-true}
      - VISION_MODEL=${VISION_MODEL:-qwen-vl-max}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DEBUG=false
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bill_rag_net
      - milvus_default

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: bill_rag_postgres
    environment:
      POSTGRES_DB: bill_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"    # 暴露到宿主机，本地开发直接连 localhost:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bill_rag_net

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bill_rag_redis
    command: redis-server --maxmemory 2gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"    # 暴露到宿主机，本地开发直接连 localhost:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bill_rag_net

  # ── Milvus (Standalone) ───────────────────────────────────────────────────
  # 已注释：使用 Docker 环境中已有的 milvus-standalone 容器（网络: milvus_default）
  # app 服务已通过 networks: milvus_default 直接访问，MILVUS_HOST=milvus-standalone
  # 若需要在本项目内独立启动 Milvus，取消以下注释并同步注释掉 networks 中的 milvus_default external 配置

