  #     timeout: 20s
  #     retries: 10
  #   networks:
  #     - bill_rag_net

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: bill_rag_prometheus
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "9090:9090"
    networks:
      - bill_rag_net

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: bill_rag_grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - bill_rag_net

volumes:
  postgres_data:
  redis_data:
  # etcd_data:    # 使用外部 Milvus 时不需要
  # minio_data:   # 使用外部 Milvus 时不需要
  # milvus_data:  # 使用外部 Milvus 时不需要
  prometheus_data:
  grafana_data:

networks:
  bill_rag_net:
    driver: bridge
  milvus_default:
    # 引用 Docker 环境中已存在的 milvus_default 网络（由外部 Milvus 创建）
    # 使 app 容器可通过容器名 milvus-standalone 直接访问向量库
    external: true
