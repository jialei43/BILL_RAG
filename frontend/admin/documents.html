<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理后台 — 文档管理</title>
  <style>
    /* ── CSS 变量（与 index.html 保持一致）──────────────────── */
    :root {
      --primary:      #1e40af;
      --primary-light:#3b82f6;
      --primary-dark: #1e3a8a;
      --success:      #059669;
      --warning:      #d97706;
      --danger:       #dc2626;
      --info:         #0891b2;
      --sidebar-w:    240px;
      --topbar-h:     64px;
      --bg:           #f1f5f9;
      --card-bg:      #ffffff;
      --text:         #1e293b;
      --text-light:   #64748b;
      --border:       #e2e8f0;
      --radius:       12px;
      --shadow:       0 1px 3px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.04);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
    }
    a { text-decoration: none; color: inherit; }
    button { cursor: pointer; border: none; outline: none; font-family: inherit; }
    input, select { font-family: inherit; outline: none; }

    /* ── 侧边栏（与 index.html 相同） ─────────────────────── */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--primary-dark);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 100;
    }
    .sidebar-brand {
      height: var(--topbar-h);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 20px;
      border-bottom: 1px solid rgba(255,255,255,.1);
    }
    .sidebar-brand .brand-icon {
      width: 36px; height: 36px;
      background: var(--primary-light);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .sidebar-brand .brand-text { color: #fff; font-size: 15px; font-weight: 700; line-height: 1.2; }
    .sidebar-brand .brand-sub  { color: rgba(255,255,255,.5); font-size: 11px; }
    .sidebar-nav { flex: 1; padding: 16px 0; overflow-y: auto; }
    .nav-section-title {
      color: rgba(255,255,255,.35);
      font-size: 11px; font-weight: 600;
      letter-spacing: .08em; text-transform: uppercase;
      padding: 8px 20px; margin-top: 8px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 20px;
      color: rgba(255,255,255,.7);
      font-size: 14px;
      transition: background .15s, color .15s;
      position: relative;
    }
    .nav-item:hover { background: rgba(255,255,255,.08); color: #fff; }
    .nav-item.active { background: rgba(255,255,255,.12); color: #fff; font-weight: 600; }
    .nav-item.active::before {
      content: '';
      position: absolute; left: 0; top: 6px; bottom: 6px;
      width: 3px; background: var(--primary-light); border-radius: 0 2px 2px 0;
    }
    .nav-icon { font-size: 18px; width: 22px; text-align: center; flex-shrink: 0; }
    .sidebar-footer { padding: 16px; border-top: 1px solid rgba(255,255,255,.1); }
    .user-card {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border-radius: 8px;
      background: rgba(255,255,255,.06);
    }
    .user-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--primary-light);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 14px; font-weight: 700; flex-shrink: 0;
    }
    .user-info { flex: 1; min-width: 0; }
    .user-name { color: #fff; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-role { color: rgba(255,255,255,.5); font-size: 11px; }
    .btn-logout { background: none; padding: 4px; color: rgba(255,255,255,.4); font-size: 16px; transition: color .15s; }
    .btn-logout:hover { color: rgba(255,255,255,.8); }

    /* ── 主内容区 ─────────────────────────────────────────── */
    .main-wrap { flex: 1; margin-left: var(--sidebar-w); display: flex; flex-direction: column; min-height: 100vh; }
    .topbar {
      height: var(--topbar-h);
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px;
      position: sticky; top: 0; z-index: 50;
    }
    .topbar-title { font-size: 18px; font-weight: 700; color: var(--text); }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .page-content { flex: 1; padding: 28px; overflow-y: auto; }
    .breadcrumb { font-size: 13px; color: var(--text-light); margin-bottom: 20px; }
    .breadcrumb a { color: var(--primary-light); }
    .breadcrumb span { color: var(--text); font-weight: 500; }

    /* ── 按钮 ─────────────────────────────────────────────── */
    .btn {
      height: 36px; padding: 0 16px;
      border-radius: 8px; font-size: 13px; font-weight: 600;
      display: inline-flex; align-items: center; gap: 6px;
      transition: all .15s;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-light); }
    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-outline:hover { background: var(--bg); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-sm { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 6px; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }

    /* ── 拖拽上传区域 ─────────────────────────────────────── */
    .upload-zone {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 24px;
      overflow: hidden;
    }
    .upload-zone-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
    }
    .upload-zone-title { font-size: 15px; font-weight: 700; }
    .drop-area {
      margin: 20px 24px;
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all .2s;
    }
    .drop-area.drag-over {
      border-color: var(--primary-light);
      background: #eff6ff;
    }
    .drop-area:hover {
      border-color: var(--primary-light);
      background: #f8fafc;
    }
    .drop-icon { font-size: 48px; margin-bottom: 12px; opacity: .5; }
    .drop-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    .drop-hint { font-size: 12px; color: var(--text-light); }
    .drop-formats { font-size: 11px; color: var(--text-light); margin-top: 6px; }

    /* 上传文件列表（待上传队列） */
    .upload-queue { padding: 0 24px 20px; }
    .queue-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
      background: var(--bg);
    }
    .queue-item-icon { font-size: 22px; flex-shrink: 0; }
    .queue-item-info { flex: 1; min-width: 0; }
    .queue-item-name { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .queue-item-size { font-size: 11px; color: var(--text-light); }
    .progress-wrap { margin-top: 4px; }
    .progress-bar {
      height: 4px; background: var(--border); border-radius: 2px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: var(--primary-light); border-radius: 2px;
      transition: width .3s ease;
    }
    .queue-item-status { font-size: 12px; color: var(--text-light); flex-shrink: 0; }
    .queue-item-status.success  { color: var(--success); }
    .queue-item-status.error    { color: var(--danger); }
    .queue-item-status.uploading { color: var(--primary-light); }
    .queue-item-error { font-size: 11px; color: var(--danger); margin-top: 3px;
                        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .queue-actions { padding: 0 24px 20px; display: flex; gap: 10px; }

    /* ── 工具栏（搜索 + 筛选 + 操作）─────────────────────── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .search-wrap {
      flex: 1; min-width: 200px; max-width: 320px;
      position: relative;
    }
    .search-input {
      width: 100%; height: 36px;
      padding: 0 12px 0 36px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      background: var(--card-bg);
      color: var(--text);
      transition: border .15s;
    }
    .search-input:focus { border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(59,130,246,.1); }
    .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 15px; color: var(--text-light); pointer-events: none; }
    .filter-select {
      height: 36px; padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 8px; font-size: 13px;
      background: var(--card-bg); color: var(--text);
    }

    /* ── 文档列表卡片 ─────────────────────────────────────── */
    .doc-list-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .doc-list-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .doc-count { color: var(--text-light); }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th {
      background: var(--bg);
      color: var(--text-light);
      font-weight: 600; font-size: 11px;
      text-transform: uppercase; letter-spacing: .06em;
      padding: 10px 16px; text-align: left;
      border-bottom: 1px solid var(--border);
    }
    /* 允许点击列名排序 */
    thead th.sortable { cursor: pointer; user-select: none; }
    thead th.sortable:hover { color: var(--primary-light); }
    tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f8fafc; }
    tbody td { padding: 12px 16px; vertical-align: middle; }
    .col-check { width: 36px; }
    .col-status { width: 100px; }
    .col-chunks { width: 80px; }
    .col-date   { width: 140px; }
    .col-action { width: 120px; }

    /* 复选框全选 */
    .check-all, .check-one {
      width: 16px; height: 16px; cursor: pointer;
      accent-color: var(--primary);
    }

    /* 状态徽章 */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 600;
    }
    .badge-success { background: #d1fae5; color: #065f46; }
    .badge-danger  { background: #fee2e2; color: #7f1d1d; }
    .badge-warning { background: #fef3c7; color: #78350f; }
    .badge-info    { background: #cffafe; color: #0c4a6e; }
    .badge-default { background: #f1f5f9; color: #475569; }

    /* 文件名列 */
    .file-name-cell { display: flex; align-items: center; gap: 8px; }
    .file-icon-sm { font-size: 22px; flex-shrink: 0; }
    .file-name-text { font-weight: 500; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-size-text { font-size: 11px; color: var(--text-light); }

    /* 操作按钮组 */
    .action-group { display: flex; align-items: center; gap: 6px; }
    .icon-btn {
      width: 28px; height: 28px;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      background: var(--bg);
      transition: all .15s;
    }
    .icon-btn:hover { background: #e2e8f0; }
    .icon-btn.danger:hover { background: #fee2e2; }

    /* ── 分页 ─────────────────────────────────────────────── */
    .pagination {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      font-size: 13px;
    }
    .pagination-info { color: var(--text-light); }
    .pagination-btns { display: flex; gap: 6px; }
    .page-btn {
      width: 32px; height: 32px;
      border-radius: 6px; font-size: 13px; font-weight: 500;
      background: var(--bg); color: var(--text);
      display: flex; align-items: center; justify-content: center;
      transition: all .15s;
    }
    .page-btn:hover { background: var(--primary-light); color: #fff; }
    .page-btn.active { background: var(--primary); color: #fff; }
    .page-btn:disabled { opacity: .4; cursor: not-allowed; }

    /* ── 批量操作栏（选中文档后浮现）──────────────────────── */
    .bulk-bar {
      position: fixed;
      bottom: 24px; left: 50%;
      transform: translateX(-50%);
      background: var(--text);
      color: #fff;
      border-radius: 12px;
      padding: 12px 20px;
      display: flex; align-items: center; gap: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,.2);
      z-index: 200;
      font-size: 13px;
      transition: opacity .2s, transform .2s;
      opacity: 0; pointer-events: none;
    }
    .bulk-bar.show { opacity: 1; pointer-events: auto; }
    .bulk-count { font-weight: 700; }
    .bulk-bar button {
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px; font-weight: 600;
      color: #fff;
    }
    .bulk-delete-btn { background: var(--danger); }
    .bulk-cancel-btn { background: rgba(255,255,255,.15); }

    /* ── 删除确认对话框 ────────────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      display: flex; align-items: center; justify-content: center;
      z-index: 500;
      opacity: 0; pointer-events: none;
      transition: opacity .2s;
    }
    .modal-overlay.show { opacity: 1; pointer-events: auto; }
    .modal {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 28px;
      width: 400px;
      box-shadow: 0 20px 40px rgba(0,0,0,.15);
      transform: scale(.95);
      transition: transform .2s;
    }
    .modal-overlay.show .modal { transform: scale(1); }
    .modal-icon { font-size: 40px; text-align: center; margin-bottom: 12px; }
    .modal-title { font-size: 16px; font-weight: 700; text-align: center; margin-bottom: 8px; }
    .modal-desc { font-size: 13px; color: var(--text-light); text-align: center; margin-bottom: 24px; line-height: 1.6; }
    .modal-actions { display: flex; gap: 12px; }
    .modal-actions button { flex: 1; height: 40px; border-radius: 8px; font-size: 14px; font-weight: 600; }

    /* ── 文档详情抽屉 ──────────────────────────────────────── */
    .drawer-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.3);
      z-index: 400;
      opacity: 0; pointer-events: none;
      transition: opacity .25s;
    }
    .drawer-overlay.show { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed; right: -440px; top: 0; bottom: 0;
      width: 440px;
      background: var(--card-bg);
      box-shadow: -4px 0 24px rgba(0,0,0,.12);
      z-index: 401;
      transition: right .25s ease;
      display: flex; flex-direction: column;
    }
    .drawer.open { right: 0; }
    .drawer-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
    }
    .drawer-title { font-size: 16px; font-weight: 700; }
    .drawer-close {
      width: 32px; height: 32px;
      border-radius: 6px; background: var(--bg);
      font-size: 18px; display: flex; align-items: center; justify-content: center;
    }
    .drawer-close:hover { background: var(--border); }
    .drawer-body { flex: 1; overflow-y: auto; padding: 24px; }
    .detail-row {
      display: flex; align-items: flex-start;
      padding: 12px 0; border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { width: 90px; font-size: 12px; color: var(--text-light); flex-shrink: 0; padding-top: 2px; }
    .detail-value { flex: 1; font-size: 13px; word-break: break-all; }

    /* ── 空状态 ───────────────────────────────────────────── */
    .empty-state { text-align: center; padding: 60px 24px; color: var(--text-light); }
    .empty-icon { font-size: 52px; margin-bottom: 12px; opacity: .4; }
    .empty-text { font-size: 14px; margin-bottom: 16px; }

    /* ── Toast ────────────────────────────────────────────── */
    #toast-container {
      position: fixed; top: 20px; right: 20px;
      z-index: 9999; display: flex; flex-direction: column; gap: 8px;
    }
    .toast {
      background: #1e293b; color: #fff;
      padding: 10px 18px; border-radius: 8px;
      font-size: 13px; box-shadow: 0 4px 12px rgba(0,0,0,.25);
      animation: slideIn .25s ease;
    }
    .toast.success { border-left: 4px solid var(--success); }
    .toast.error   { border-left: 4px solid var(--danger); }
    .toast.warning { border-left: 4px solid var(--warning); }
    @keyframes slideIn { from { transform: translateX(40px); opacity: 0; } }

    /* ── Loading 蒙层 ─────────────────────────────────────── */
    .skeleton { background: linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius:6px; }
    @keyframes shimmer { to { background-position: -200% 0; } }
  </style>
</head>

  <div class="sidebar-brand">

      <div class="brand-text">票据智能顾问</div>

    </div>

<!-- ══════════════════════════════════════════════════════════
     主内容区
══════════════════════════════════════════════════════════ -->
<div class="main-wrap">
  <header class="topbar">
    <div class="topbar-title">文档管理</div>
    <div class="topbar-right">
      <button class="btn btn-outline" id="btn-reload">🔄 刷新</button>
    </div>
  </header>

  <main class="page-content">
    <div class="breadcrumb">
      <a href="./index.html">管理后台</a> / <span>文档管理</span>
    </div>

    <!-- ── 拖拽上传区域 ── -->
    <div class="upload-zone">
      <div class="upload-zone-header">
        <div class="upload-zone-title">📤 上传知识库文档</div>
        <button class="btn btn-primary" id="btn-pick-file">选择文件</button>
        <!-- 隐藏的文件选择器（支持多选） -->
        <input type="file" id="file-input" multiple accept=".pdf,.doc,.docx,.xlsx,.xls,.png,.jpg,.jpeg,.tiff" style="display:none;" />
      </div>

      <!-- 拖拽区域 -->
      <div class="drop-area" id="drop-area">
        <div class="drop-icon">📂</div>
        <div class="drop-title">将文件拖拽到此区域，或点击"选择文件"</div>
        <div class="drop-hint">支持批量上传，处理后自动向量化入库</div>
        <div class="drop-formats">支持格式：PDF · Word · Excel · PNG · JPG · TIFF（单文件 ≤ 50MB）</div>
      </div>

      <!-- 待上传文件队列（动态插入） -->
      <div class="upload-queue" id="upload-queue"></div>

      <!-- 上传操作按钮（有文件时显示） -->
      <div class="queue-actions" id="queue-actions" style="display:none;">
        <button class="btn btn-primary" id="btn-start-upload">🚀 开始上传</button>
        <button class="btn btn-outline" id="btn-clear-queue">清空队列</button>
      </div>
    </div>

    <!-- ── 工具栏：搜索 + 状态筛选 + 批量删除 ── -->
    <div class="toolbar">
      <!-- 搜索框 -->
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" id="search-input" placeholder="搜索文件名…" />
      </div>

      <!-- 状态筛选 -->
      <select class="filter-select" id="status-filter">
        <option value="">全部状态</option>
        <option value="completed">已完成</option>
        <option value="processing">处理中</option>
        <option value="pending">等待中</option>
        <option value="failed">已失败</option>
      </select>

      <!-- 占位，把右侧按钮推到右边 -->
      <div style="flex:1;"></div>

      <!-- 批量重试（仅对 failed 文档生效）-->
      <button class="btn btn-outline" id="btn-retry-all">🔁 重试失败</button>
    </div>

    <!-- ── 文档列表 ── -->
    <div class="doc-list-card">
      <div class="doc-list-header">
        <div class="doc-count" id="doc-count">共 0 份文档</div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="col-check">
                <input type="checkbox" class="check-all" id="check-all" title="全选" />
              </th>
              <th>文件名</th>
              <th class="col-status">状态</th>
              <th class="col-chunks">分块数</th>
              <th class="col-date sortable">上传时间 ↕</th>
              <th class="col-action">操作</th>
            </tr>
          </thead>
          <tbody id="doc-tbody">
            <!-- JS 动态渲染 -->
            <tr><td colspan="6">
              <div class="empty-state"><div class="empty-text">加载中...</div></div>
            </td></tr>
          </tbody>
        </table>
      </div>

      <!-- 分页 -->
      <div class="pagination">
        <div class="pagination-info" id="page-info">第 1 页 / 共 1 页</div>
        <div class="pagination-btns" id="page-btns">
          <button class="page-btn" id="btn-prev" disabled>‹</button>
          <button class="page-btn" id="btn-next" disabled>›</button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- ── 批量操作悬浮栏（选中文档后出现）── -->
<div class="bulk-bar" id="bulk-bar">
  <span>已选择 <span class="bulk-count" id="bulk-count">0</span> 项</span>
  <button class="bulk-delete-btn" id="bulk-delete-btn">🗑️ 批量删除</button>
  <button class="bulk-cancel-btn" id="bulk-cancel-btn">取消</button>
</div>

<!-- ── 删除确认对话框 ── -->
<div class="modal-overlay" id="delete-modal">
  <div class="modal">
    <div class="modal-icon">⚠️</div>
    <div class="modal-title" id="delete-modal-title">确认删除文档？</div>
    <div class="modal-desc" id="delete-modal-desc">
      此操作将从知识库中移除文档及其所有向量数据，无法撤销。
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" id="delete-cancel-btn">取消</button>
      <button class="btn btn-danger" id="delete-confirm-btn">确认删除</button>
    </div>
  </div>
</div>

<!-- ── 文档详情抽屉 ── -->
<div class="drawer-overlay" id="drawer-overlay"></div>
<div class="drawer" id="doc-drawer">
  <div class="drawer-header">
    <div class="drawer-title">文档详情</div>
    <button class="drawer-close" id="drawer-close">✕</button>
  </div>
  <div class="drawer-body" id="drawer-body">
    <!-- 由 JS 填充 -->
  </div>
</div>

<!-- Toast -->
<div id="toast-container"></div>

<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/api.js?v=2"></script>

<script>
/* ══════════════════════════════════════════════════════════
   documents.js — 文档管理页面逻辑
══════════════════════════════════════════════════════════ */

// ── 路由守卫 ─────────────────────────────────────────────────
Auth.guardRoute(CONFIG.ROLE.ADMIN);

// ── DOM 引用 ──────────────────────────────────────────────────
const $dropArea     = document.getElementById('drop-area');
const $fileInput    = document.getElementById('file-input');
const $uploadQueue  = document.getElementById('upload-queue');
const $queueActions = document.getElementById('queue-actions');
const $docTbody     = document.getElementById('doc-tbody');
const $docCount     = document.getElementById('doc-count');
const $searchInput  = document.getElementById('search-input');
const $statusFilter = document.getElementById('status-filter');
const $checkAll     = document.getElementById('check-all');
const $bulkBar      = document.getElementById('bulk-bar');
const $bulkCount    = document.getElementById('bulk-count');
const $pageInfo     = document.getElementById('page-info');
const $btnPrev      = document.getElementById('btn-prev');
const $btnNext      = document.getElementById('btn-next');

// ── 状态 ─────────────────────────────────────────────────────
let _uploadQueue  = [];       // 待上传文件数组 {file, status, progress, id}
let _docs         = [];       // 当前页文档列表
let _total        = 0;        // 总文档数
let _currentPage  = 1;        // 当前页码
let _selectedIds  = new Set();// 已勾选文档 ID 集合
let _pendingDelete = null;    // 待删除操作 {ids: [...]}
let _searchTimer  = null;     // 搜索防抖定时器

// ── 初始化侧边栏 ──────────────────────────────────────────────
(function initUser() {
  const user = Auth.getUser();
  if (!user) return;
  const name = user.username || '管理员';
  document.getElementById('sidebar-username').textContent = name;
  document.getElementById('user-avatar-text').textContent = name.charAt(0).toUpperCase();
})();

document.getElementById('btn-logout').addEventListener('click', () => Auth.logout());

/* ────────────────────────────────────────────────────────────
   拖拽上传逻辑
──────────────────────────────────────────────────────────── */

// 点击"选择文件"按钮触发隐藏文件选择器
document.getElementById('btn-pick-file').addEventListener('click', () => $fileInput.click());

// 文件选择器变化
$fileInput.addEventListener('change', (e) => addToQueue(Array.from(e.target.files)));

// 拖入区域：阻止默认行为并高亮
$dropArea.addEventListener('dragover', (e) => {
  e.preventDefault();
  $dropArea.classList.add('drag-over');
});

// 拖出区域：取消高亮
$dropArea.addEventListener('dragleave', () => $dropArea.classList.remove('drag-over'));

// 放置文件
$dropArea.addEventListener('drop', (e) => {
  e.preventDefault();
  $dropArea.classList.remove('drag-over');
  const files = Array.from(e.dataTransfer.files);
  addToQueue(files);
});

// 点击拖拽区域也能选文件
$dropArea.addEventListener('click', () => $fileInput.click());

/**
 * 将文件列表加入上传队列
 * @param {File[]} files
 */
function addToQueue(files) {
  const allowed = CONFIG.UPLOAD.DOC_TYPES;
  const maxSize = CONFIG.UPLOAD.MAX_SIZE;

  files.forEach(file => {
    // 验证格式
    if (!Utils.isFileTypeAllowed(file, allowed)) {
      Utils.toast(`不支持的文件类型：${Utils.getFileExt(file.name)}`, 'error');
      return;
    }
    // 验证大小
    if (file.size > maxSize) {
      Utils.toast(`文件过大：${file.name}（最大 50MB）`, 'error');
      return;
    }
    // 避免重复添加同名文件
    if (_uploadQueue.some(q => q.file.name === file.name && q.file.size === file.size)) {
      Utils.toast(`${file.name} 已在队列中`, 'warning');
      return;
    }
    // 生成唯一 ID
    const id = `upload_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
    _uploadQueue.push({ id, file, status: 'pending', progress: 0 });
  });

  renderQueue();
}

/** 渲染待上传队列 */
function renderQueue() {
  if (_uploadQueue.length === 0) {
    $uploadQueue.innerHTML = '';
    $queueActions.style.display = 'none';
    return;
  }

  $queueActions.style.display = 'flex';
  $uploadQueue.innerHTML = _uploadQueue.map(item => {
    let statusLabel = '';
    let statusClass = item.status;
    if      (item.status === 'pending')   { statusLabel = '等待上传'; }
    else if (item.status === 'uploading') { statusLabel = `${item.progress}%`; }
    else if (item.status === 'parsing')   { statusLabel = '⏳ 解析中…'; statusClass = 'uploading'; }
    else if (item.status === 'success')   { statusLabel = item.chunkCount ? `✓ 完成（${item.chunkCount} 块）` : '✓ 解析完成'; }
    else if (item.status === 'error')     { statusLabel = '✗ 失败'; }

    return `
    <div class="queue-item" id="qitem-${item.id}">
      <div class="queue-item-icon">${Utils.fileIcon(item.file.name)}</div>
      <div class="queue-item-info">
        <div class="queue-item-name" title="${Utils.escapeHtml(item.file.name)}">${Utils.escapeHtml(item.file.name)}</div>
        <div class="queue-item-size">${Utils.formatFileSize(item.file.size)}</div>
        ${item.status === 'uploading' ? `
          <div class="progress-wrap">
            <div class="progress-bar"><div class="progress-fill" style="width:${item.progress}%;"></div></div>
          </div>
        ` : ''}
        ${item.status === 'error' && item.errorMsg ? `
          <div class="queue-item-error" title="${Utils.escapeHtml(item.errorMsg)}">${Utils.escapeHtml(item.errorMsg.slice(0, 60))}${item.errorMsg.length > 60 ? '…' : ''}</div>
        ` : ''}
      </div>
      <div class="queue-item-status ${statusClass}">${statusLabel}</div>
      ${item.status === 'pending' ? `
        <button class="icon-btn danger" onclick="removeFromQueue('${item.id}')" title="移除">✕</button>
      ` : ''}
      ${item.status === 'error' && (item.batchId || item.docId) ? `
        <button class="icon-btn" onclick="retryQueueItem('${item.id}')" title="重新解析" style="margin-left:4px;">🔁</button>
      ` : ''}
    </div>
  `}).join('');
}

/** 从队列中移除单个文件 */
function removeFromQueue(id) {
  _uploadQueue = _uploadQueue.filter(q => q.id !== id);
  renderQueue();
}

// 清空整个队列
document.getElementById('btn-clear-queue').addEventListener('click', () => {
  _uploadQueue = [];
  renderQueue();
});

// 开始上传按钮
document.getElementById('btn-start-upload').addEventListener('click', startUpload);

/** 逐个上传队列中的文件 */
async function startUpload() {
  const pending = _uploadQueue.filter(q => q.status === 'pending');
  if (pending.length === 0) return;

  for (const item of pending) {
    item.status = 'uploading';
    item.progress = 0;
    renderQueue();

    try {
      const resp = await API.docs.upload(item.file, (pct) => {
        item.progress = pct;
        const el = document.getElementById(`qitem-${item.id}`);
        if (el) {
          const fill = el.querySelector('.progress-fill');
          const statusEl = el.querySelector('.queue-item-status');
          if (fill) fill.style.width = pct + '%';
          if (statusEl) statusEl.textContent = pct + '%';
        }
      });
      // HTTP 202：文件已收到，后台解析中
      item.status = 'parsing';
      item.batchId = resp.batch_id;
      item.docId   = resp.id;
    } catch (e) {
      item.status = 'error';
      item.errorMsg = e.message;
      console.error('上传失败', item.file.name, e);
    }

    renderQueue();
  }

  Utils.toast('文件已提交，正在后台解析…', 'success');

  // 为每个进入"解析中"状态的文件启动独立轮询
  const parsingItems = _uploadQueue.filter(q => q.status === 'parsing' && q.batchId);
  parsingItems.forEach(item => _pollParseStatus(item));

  // 无论如何都刷新一次文档列表
  setTimeout(() => loadDocs(), 1500);
}

/**
 * 轮询单个文件的解析状态（通过 batch_id）
 * 每 2s 查询一次，最多等 5 分钟；完成/失败后更新队列展示。
 */
async function _pollParseStatus(item) {
  const MAX_POLLS = 150;  // 150 × 2s = 5 分钟
  for (let i = 0; i < MAX_POLLS; i++) {
    await new Promise(r => setTimeout(r, 2000));
    try {
      const batchStatus = await API.docs.batchStatus(item.batchId);
      if (batchStatus.overall_status === 'completed') {
        item.status     = 'success';
        item.chunkCount = batchStatus.documents?.[0]?.chunk_count || 0;
        renderQueue();
        loadDocs();  // 刷新列表
        return;
      }
      if (batchStatus.overall_status === 'failed') {
        item.status   = 'error';
        item.errorMsg = batchStatus.documents?.[0]?.error_msg || '解析失败';
        renderQueue();
        loadDocs();
        return;
      }
      // still processing → continue loop
    } catch (_) { /* 轮询网络抖动，忽略本次，继续下次 */ }
  }
  // 超时：放弃轮询，提示用户手动刷新
  item.status   = 'error';
  item.errorMsg = '解析超时，请稍后刷新列表查看最终状态';
  renderQueue();
}

/**
 * 重试队列中某个失败文件的解析
 * 优先使用 batchRetry（支持级联传播），fallback 到单文件 retry
 */
async function retryQueueItem(queueItemId) {
  const item = _uploadQueue.find(q => q.id === queueItemId);
  if (!item) return;

  try {
    let newBatchId;
    if (item.batchId) {
      const resp   = await API.docs.batchRetry(item.batchId);
      newBatchId   = resp.batch_id;
    } else if (item.docId) {
      await API.docs.retry(item.docId);
      // 单文件 retry 没有新 batch_id，无法轮询，刷新列表兜底
      item.status   = 'parsing';
      item.errorMsg = null;
      renderQueue();
      setTimeout(() => loadDocs(), 3000);
      Utils.toast('已重新提交解析', 'success');
      return;
    }
    item.status   = 'parsing';
    item.batchId  = newBatchId;
    item.errorMsg = null;
    renderQueue();
    _pollParseStatus(item);
    Utils.toast('已重新提交解析', 'success');
  } catch (e) {
    Utils.toast('重试失败: ' + e.message, 'error');
  }
}

/* ────────────────────────────────────────────────────────────
   文档列表加载与渲染
──────────────────────────────────────────────────────────── */

/** 加载文档列表（带分页和筛选） */
async function loadDocs() {
  // 清空选中状态
  _selectedIds.clear();
  updateBulkBar();

  try {
    const params = {
      page: _currentPage,
      page_size: CONFIG.PAGE_SIZE,
    };
    // 仅在有状态筛选时传参
    if ($statusFilter.value) params.status_filter = $statusFilter.value;

    const resp = await API.docs.list(params);
    _docs  = resp?.documents ?? resp?.items ?? [];
    _total = resp?.total ?? _docs.length;

    // 客户端搜索过滤（后端不支持文件名搜索时降级到前端过滤）
    const keyword = $searchInput.value.trim().toLowerCase();
    const filtered = keyword
      ? _docs.filter(d => (d.filename || d.file_name || '').toLowerCase().includes(keyword))
      : _docs;

    renderDocTable(filtered);
    renderPagination(filtered.length);
    $docCount.textContent = `共 ${_total} 份文档`;

  } catch (e) {
    console.error('加载文档列表失败', e);
    $docTbody.innerHTML = `
      <tr><td colspan="6">
        <div class="empty-state">
          <div class="empty-icon">⚠️</div>
          <div class="empty-text">加载失败：${Utils.escapeHtml(e.message)}</div>
        </div>
      </td></tr>
    `;
  }
}

/** 渲染文档表格 */
function renderDocTable(docs) {
  if (docs.length === 0) {
    $docTbody.innerHTML = `
      <tr><td colspan="6">
        <div class="empty-state">
          <div class="empty-icon">📂</div>
          <div class="empty-text">暂无文档，请上传知识库文档</div>
        </div>
      </td></tr>
    `;
    return;
  }

  $docTbody.innerHTML = docs.map(doc => {
    const id       = doc.id || doc.doc_id;
    const filename = doc.filename || doc.file_name || '-';
    const badge    = Utils.docStatusBadge(doc.status);
    const checked  = _selectedIds.has(id) ? 'checked' : '';
    return `
      <tr data-id="${id}">
        <td class="col-check">
          <input type="checkbox" class="check-one" value="${id}" ${checked} onchange="onCheckChange(this)" />
        </td>
        <td>
          <div class="file-name-cell">
            <span class="file-icon-sm">${Utils.fileIcon(filename)}</span>
            <div>
              <div class="file-name-text" title="${Utils.escapeHtml(filename)}">${Utils.escapeHtml(filename)}</div>
              <div class="file-size-text">${Utils.formatFileSize(doc.file_size || 0)}</div>
            </div>
          </div>
        </td>
        <td class="col-status">
          <span class="badge ${badge.colorClass}">${badge.label}</span>
        </td>
        <td class="col-chunks">${doc.chunk_count ?? '-'}</td>
        <td class="col-date">${Utils.formatDate(doc.created_at, true)}</td>
        <td class="col-action">
          <div class="action-group">
            <!-- 详情按钮 -->
            <button class="icon-btn" onclick="showDocDetail('${id}')" title="查看详情">🔍</button>
            <!-- 重试按钮（仅失败文档显示） -->
            ${doc.status === 'failed' ? `
              <button class="icon-btn" onclick="retryDoc('${id}')" title="重新解析">🔁</button>
            ` : ''}
            <!-- 删除按钮 -->
            <button class="icon-btn danger" onclick="confirmDelete(['${id}'], '${Utils.escapeHtml(filename)}')" title="删除">🗑️</button>
          </div>
        </td>
      </tr>
    `;
  }).join('');
}

/** 渲染分页控件 */
function renderPagination(currentCount) {
  const totalPages = Math.max(1, Math.ceil(_total / CONFIG.PAGE_SIZE));
  $pageInfo.textContent = `第 ${_currentPage} 页 / 共 ${totalPages} 页（${_total} 条）`;
  $btnPrev.disabled = _currentPage <= 1;
  $btnNext.disabled = _currentPage >= totalPages || currentCount < CONFIG.PAGE_SIZE;
}

// 上一页
$btnPrev.addEventListener('click', () => { _currentPage--; loadDocs(); });
// 下一页
$btnNext.addEventListener('click', () => { _currentPage++; loadDocs(); });

// 搜索防抖 300ms
$searchInput.addEventListener('input', () => {
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(() => { _currentPage = 1; loadDocs(); }, 300);
});

// 状态筛选变化立即加载
$statusFilter.addEventListener('change', () => { _currentPage = 1; loadDocs(); });

// 刷新按钮
document.getElementById('btn-reload').addEventListener('click', loadDocs);

/* ────────────────────────────────────────────────────────────
   复选框与批量操作
──────────────────────────────────────────────────────────── */

/** 单个复选框变化 */
function onCheckChange(checkbox) {
  if (checkbox.checked) {
    _selectedIds.add(checkbox.value);
  } else {
    _selectedIds.delete(checkbox.value);
  }
  // 更新全选状态
  const allChecks = document.querySelectorAll('.check-one');
  $checkAll.checked = allChecks.length > 0 && [...allChecks].every(c => c.checked);
  updateBulkBar();
}

/** 全选/反选 */
$checkAll.addEventListener('change', () => {
  const checked = $checkAll.checked;
  document.querySelectorAll('.check-one').forEach(c => {
    c.checked = checked;
    if (checked) _selectedIds.add(c.value);
    else _selectedIds.delete(c.value);
  });
  updateBulkBar();
});

/** 更新批量操作栏显示 */
function updateBulkBar() {
  const count = _selectedIds.size;
  $bulkCount.textContent = count;
  $bulkBar.classList.toggle('show', count > 0);   // 有选中才显示
}

// 批量删除按钮
document.getElementById('bulk-delete-btn').addEventListener('click', () => {
  const ids = [..._selectedIds];
  confirmDelete(ids, `${ids.length} 份文档`);
});

// 取消批量选择
document.getElementById('bulk-cancel-btn').addEventListener('click', () => {
  _selectedIds.clear();
  document.querySelectorAll('.check-one').forEach(c => c.checked = false);
  $checkAll.checked = false;
  updateBulkBar();
});

/* ────────────────────────────────────────────────────────────
   删除逻辑
──────────────────────────────────────────────────────────── */

/**
 * 弹出删除确认框
 * @param {string[]} ids
 * @param {string} nameHint
 */
function confirmDelete(ids, nameHint) {
  _pendingDelete = { ids };
  document.getElementById('delete-modal-desc').textContent =
    `将删除：${nameHint}。此操作会移除知识库中所有相关向量数据，无法撤销。`;
  document.getElementById('delete-modal').classList.add('show');
}

// 取消删除
document.getElementById('delete-cancel-btn').addEventListener('click', () => {
  document.getElementById('delete-modal').classList.remove('show');
  _pendingDelete = null;
});

// 确认删除：批量并行调用 API
document.getElementById('delete-confirm-btn').addEventListener('click', async () => {
  if (!_pendingDelete) return;
  const { ids } = _pendingDelete;
  document.getElementById('delete-modal').classList.remove('show');

  const $btn = document.getElementById('delete-confirm-btn');
  $btn.disabled = true;
  $btn.textContent = '删除中...';

  const results = await Promise.allSettled(ids.map(id => API.docs.delete(id)));
  const ok    = results.filter(r => r.status === 'fulfilled').length;
  const fail  = results.length - ok;

  Utils.toast(
    fail > 0 ? `删除完成：${ok} 成功，${fail} 失败` : `已删除 ${ok} 份文档`,
    fail > 0 ? 'error' : 'success'
  );

  $btn.disabled = false;
  $btn.textContent = '确认删除';
  _pendingDelete = null;

  // 刷新列表
  _selectedIds.clear();
  updateBulkBar();
  loadDocs();
});

/* ────────────────────────────────────────────────────────────
   重试失败文档
──────────────────────────────────────────────────────────── */

/** 重试单个文档 */
async function retryDoc(docId) {
  try {
    await API.docs.retry(docId);
    Utils.toast('已提交重试，稍后刷新查看进度', 'success');
    setTimeout(() => loadDocs(), 2000);
  } catch (e) {
    Utils.toast('重试失败: ' + e.message, 'error');
  }
}

// 批量重试所有失败文档
document.getElementById('btn-retry-all').addEventListener('click', async () => {
  try {
    const resp = await API.docs.list({ page: 1, page_size: 100, status_filter: 'failed' });
    const failed = resp?.documents ?? resp?.items ?? [];
    if (failed.length === 0) { Utils.toast('暂无失败文档', 'success'); return; }
    const results = await Promise.allSettled(failed.map(d => API.docs.retry(d.id || d.doc_id)));
    const ok = results.filter(r => r.status === 'fulfilled').length;
    Utils.toast(`已提交 ${ok} 个文档重试`, 'success');
    setTimeout(() => loadDocs(), 2000);
  } catch (e) {
    Utils.toast('批量重试失败: ' + e.message, 'error');
  }
});

/* ────────────────────────────────────────────────────────────
   文档详情抽屉
──────────────────────────────────────────────────────────── */

const $drawer        = document.getElementById('doc-drawer');
const $drawerOverlay = document.getElementById('drawer-overlay');
const $drawerBody    = document.getElementById('drawer-body');

/** 打开文档详情抽屉 */
async function showDocDetail(docId) {
  // 先显示加载状态
  $drawer.classList.add('open');
  $drawerOverlay.classList.add('show');
  $drawerBody.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-light);">加载中...</div>';

  try {
    const doc = await API.docs.get(docId);         // 获取文档详情
    const badge = Utils.docStatusBadge(doc.status);
    const filename = doc.filename || doc.file_name || '-';
    $drawerBody.innerHTML = `
      <div class="detail-row">
        <div class="detail-label">文件名</div>
        <div class="detail-value"><strong>${Utils.escapeHtml(filename)}</strong></div>
      </div>
      <div class="detail-row">
        <div class="detail-label">文档 ID</div>
        <div class="detail-value" style="font-family:monospace;font-size:12px;">${Utils.escapeHtml(String(doc.id || doc.doc_id))}</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">处理状态</div>
        <div class="detail-value"><span class="badge ${badge.colorClass}">${badge.label}</span></div>
      </div>
      <div class="detail-row">
        <div class="detail-label">文件大小</div>
        <div class="detail-value">${Utils.formatFileSize(doc.file_size || 0)}</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">分块总数</div>
        <div class="detail-value">${doc.chunk_count ?? '-'} 个分块</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">上传时间</div>
        <div class="detail-value">${Utils.formatDate(doc.created_at, true)}</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">更新时间</div>
        <div class="detail-value">${Utils.formatDate(doc.updated_at, true)}</div>
      </div>
      ${doc.error_message ? `
        <div class="detail-row">
          <div class="detail-label">错误信息</div>
          <div class="detail-value" style="color:var(--danger);">${Utils.escapeHtml(doc.error_message)}</div>
        </div>
      ` : ''}
      ${doc.status === 'failed' ? `
        <div style="margin-top:20px;">
          <button class="btn btn-outline" style="width:100%;" onclick="retryDoc('${doc.id || doc.doc_id}');closeDrawer();">
            🔁 重新解析此文档
          </button>
        </div>
      ` : ''}
    `;
  } catch (e) {
    $drawerBody.innerHTML = `<div style="color:var(--danger);padding:20px;">加载失败：${Utils.escapeHtml(e.message)}</div>`;
  }
}

/** 关闭文档详情抽屉 */
function closeDrawer() {
  $drawer.classList.remove('open');
  $drawerOverlay.classList.remove('show');
}

document.getElementById('drawer-close').addEventListener('click', closeDrawer);
$drawerOverlay.addEventListener('click', closeDrawer);

/* ── 初始加载 ─────────────────────────────────────────────── */
loadDocs();
</script>
</body>
</html>
