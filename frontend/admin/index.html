<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理后台 — 仪表板</title>
  <style>
    /* ── CSS 变量：主题色系 ─────────────────────────────────── */
    :root {
      --primary:      #1e40af;          /* 主色（深蓝） */
      --primary-light:#3b82f6;          /* 主色浅色变体 */
      --primary-dark: #1e3a8a;          /* 主色深色变体 */
      --success:      #059669;          /* 成功绿 */
      --warning:      #d97706;          /* 警告橙 */
      --danger:       #dc2626;          /* 危险红 */
      --info:         #0891b2;          /* 信息青 */
      --sidebar-w:    240px;            /* 侧边栏宽度 */
      --topbar-h:     64px;             /* 顶部栏高度 */
      --bg:           #f1f5f9;          /* 页面背景 */
      --card-bg:      #ffffff;          /* 卡片背景 */
      --text:         #1e293b;          /* 主文字色 */
      --text-light:   #64748b;          /* 次文字色 */
      --border:       #e2e8f0;          /* 边框色 */
      --radius:       12px;             /* 圆角 */
      --shadow:       0 1px 3px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.04);
    }

    /* ── 重置与基础 ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }
    a { text-decoration: none; color: inherit; }
    button { cursor: pointer; border: none; outline: none; font-family: inherit; }
    input, select { font-family: inherit; outline: none; }

    /* ══════════════════════════════════════════════════════════
       侧边栏
    ══════════════════════════════════════════════════════════ */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--primary-dark);  /* 深蓝侧边栏 */
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 100;
      transition: transform .25s ease;
    }

    /* 品牌 logo 区域 */
    .sidebar-brand {
      height: var(--topbar-h);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 20px;
      border-bottom: 1px solid rgba(255,255,255,.1);
    }
    .sidebar-brand .brand-icon {
      width: 36px; height: 36px;
      background: var(--primary-light);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .sidebar-brand .brand-text {
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.2;
    }
    .sidebar-brand .brand-sub {
      color: rgba(255,255,255,.5);
      font-size: 11px;
    }

    /* 导航菜单 */
    .sidebar-nav {
      flex: 1;
      padding: 16px 0;
      overflow-y: auto;
    }
    .nav-section-title {
      color: rgba(255,255,255,.35);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 8px 20px;
      margin-top: 8px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      color: rgba(255,255,255,.7);
      font-size: 14px;
      border-radius: 0;
      transition: background .15s, color .15s;
      position: relative;
    }
    .nav-item:hover { background: rgba(255,255,255,.08); color: #fff; }
    .nav-item.active {
      background: rgba(255,255,255,.12);
      color: #fff;
      font-weight: 600;
    }
    /* 激活状态左边蓝线 */
    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0; top: 6px; bottom: 6px;
      width: 3px;
      background: var(--primary-light);
      border-radius: 0 2px 2px 0;
    }
    .nav-icon { font-size: 18px; width: 22px; text-align: center; flex-shrink: 0; }

    /* 底部用户信息 */
    .sidebar-footer {
      padding: 16px;
      border-top: 1px solid rgba(255,255,255,.1);
    }
    .user-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(255,255,255,.06);
    }
    .user-avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--primary-light);
      display: flex; align-items: center; justify-content: center;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .user-info { flex: 1; min-width: 0; }
    .user-name { color: #fff; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-role { color: rgba(255,255,255,.5); font-size: 11px; }
    .btn-logout {
      background: none;
      padding: 4px;
      color: rgba(255,255,255,.4);
      font-size: 16px;
      transition: color .15s;
    }
    .btn-logout:hover { color: rgba(255,255,255,.8); }

    /* ══════════════════════════════════════════════════════════
       主内容区
    ══════════════════════════════════════════════════════════ */
    .main-wrap {
      flex: 1;
      margin-left: var(--sidebar-w);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* 顶部栏 */
    .topbar {
      height: var(--topbar-h);
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .topbar-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn-refresh {
      height: 36px;
      padding: 0 16px;
      background: var(--primary);
      color: #fff;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background .15s;
    }
    .btn-refresh:hover { background: var(--primary-light); }

    /* ── 页面内容 ────────────────────────────────────────────── */
    .page-content {
      flex: 1;
      padding: 28px;
      overflow-y: auto;
    }

    /* 面包屑 */
    .breadcrumb {
      font-size: 13px;
      color: var(--text-light);
      margin-bottom: 20px;
    }
    .breadcrumb span { color: var(--text); font-weight: 500; }

    /* ── 统计卡片网格 ─────────────────────────────────────────── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: flex-start;
      gap: 16px;
      transition: box-shadow .2s;
    }
    .stat-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.1); }
    .stat-icon {
      width: 52px; height: 52px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }
    .stat-icon.blue   { background: #dbeafe; }
    .stat-icon.green  { background: #d1fae5; }
    .stat-icon.orange { background: #fef3c7; }
    .stat-icon.purple { background: #ede9fe; }
    .stat-body { flex: 1; min-width: 0; }
    .stat-value {
      font-size: 28px;
      font-weight: 800;
      color: var(--text);
      line-height: 1;
      margin-bottom: 6px;
    }
    .stat-label {
      font-size: 13px;
      color: var(--text-light);
      margin-bottom: 8px;
    }
    .stat-delta {
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .stat-delta.up   { color: var(--success); }
    .stat-delta.down { color: var(--danger); }
    .stat-delta.neutral { color: var(--text-light); }

    /* ── 中间行：图表 + 快速操作 ─────────────────────────────── */
    .mid-row {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 20px;
      margin-bottom: 28px;
    }

    /* 通用卡片 */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
    }
    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }
    .card-body { padding: 24px; }
    .card-body.no-pad { padding: 0; }

    /* 文档处理状态分布图 */
    .doc-status-chart { }
    .status-bars { display: flex; flex-direction: column; gap: 14px; }
    .status-bar-row {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
    }
    .status-bar-label { width: 60px; color: var(--text-light); text-align: right; flex-shrink: 0; }
    .status-bar-track {
      flex: 1;
      height: 8px;
      background: var(--bg);
      border-radius: 4px;
      overflow: hidden;
    }
    .status-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width .6s ease;
    }
    .status-bar-count { width: 40px; color: var(--text); font-weight: 600; text-align: right; flex-shrink: 0; }

    /* 快速操作 */
    .quick-actions { display: flex; flex-direction: column; gap: 12px; }
    .quick-action-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      border-radius: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      transition: all .15s;
      text-align: left;
      width: 100%;
    }
    .quick-action-btn:hover {
      background: #eff6ff;
      border-color: var(--primary-light);
    }
    .qa-icon {
      width: 38px; height: 38px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .qa-text .qa-title { font-size: 14px; font-weight: 600; color: var(--text); }
    .qa-text .qa-desc  { font-size: 12px; color: var(--text-light); margin-top: 2px; }
    .qa-arrow { margin-left: auto; color: var(--text-light); font-size: 16px; }

    /* ── 最近文档表格 ─────────────────────────────────────────── */
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    thead th {
      background: var(--bg);
      color: var(--text-light);
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .05em;
      padding: 10px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background .1s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f8fafc; }
    tbody td { padding: 12px 16px; vertical-align: middle; }

    /* 状态徽章 */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-success { background: #d1fae5; color: #065f46; }
    .badge-danger  { background: #fee2e2; color: #7f1d1d; }
    .badge-warning { background: #fef3c7; color: #78350f; }
    .badge-info    { background: #cffafe; color: #0c4a6e; }
    .badge-default { background: #f1f5f9; color: #475569; }

    /* 文件名样式 */
    .file-name-cell { display: flex; align-items: center; gap: 8px; }
    .file-icon-sm { font-size: 20px; }
    .file-name { font-weight: 500; color: var(--text); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-size { font-size: 11px; color: var(--text-light); }

    /* 链接按钮 */
    .link-btn {
      background: none;
      color: var(--primary-light);
      font-size: 13px;
      padding: 0;
      transition: color .15s;
    }
    .link-btn:hover { color: var(--primary); }

    /* ── 空状态 ──────────────────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-light);
    }
    .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: .4; }
    .empty-text { font-size: 14px; }

    /* ── 系统状态栏 ──────────────────────────────────────────── */
    .system-status-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }
    .service-badge {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 14px 18px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
    }
    .service-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .service-dot.online  { background: var(--success); box-shadow: 0 0 0 3px #d1fae5; }
    .service-dot.offline { background: var(--danger);  box-shadow: 0 0 0 3px #fee2e2; }
    .service-dot.unknown { background: var(--text-light); }
    .service-name { font-weight: 600; }
    .service-status { color: var(--text-light); font-size: 11px; }

    /* ── Loading 骨架屏 ──────────────────────────────────────── */
    .skeleton {
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }

    /* ── Toast 通知 ──────────────────────────────────────────── */
    #toast-container {
      position: fixed;
      top: 20px; right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .toast {
      background: #1e293b;
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      box-shadow: 0 4px 12px rgba(0,0,0,.25);
      animation: slideIn .25s ease;
    }
    .toast.success { border-left: 4px solid var(--success); }
    .toast.error   { border-left: 4px solid var(--danger); }
    @keyframes slideIn { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* ── 响应式 ──────────────────────────────────────────────── */
    @media (max-width: 1200px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .mid-row { grid-template-columns: 1fr; }
      .system-status-row { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main-wrap { margin-left: 0; }
      .stats-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- ══════════════════════════════════════════════════════════
     主内容区
══════════════════════════════════════════════════════════ -->
<div class="main-wrap">

  <!-- 顶部栏 -->
  <header class="topbar">
    <div class="topbar-title">系统仪表板</div>
    <div class="topbar-right">
      <!-- 最后刷新时间 -->
      <span style="font-size:12px;color:var(--text-light);">
        最后刷新：<span id="refresh-time">-</span>
      </span>
      <!-- 手动刷新 -->
      <button class="btn-refresh" id="btn-refresh-data">
        🔄 刷新数据
      </button>
    </div>
  </header>

  <!-- 页面主体 -->
  <main class="page-content">

    <!-- 面包屑 -->
    <div class="breadcrumb">管理后台 / <span>仪表板</span></div>

    <!-- ── 系统服务状态 ── -->
    <div class="system-status-row" id="service-status-row">
      <!-- 由 JS 动态渲染 -->
      <div class="service-badge"><div class="skeleton" style="width:10px;height:10px;border-radius:50%;"></div><div class="skeleton" style="width:80px;height:14px;"></div></div>
      <div class="service-badge"><div class="skeleton" style="width:10px;height:10px;border-radius:50%;"></div><div class="skeleton" style="width:80px;height:14px;"></div></div>
      <div class="service-badge"><div class="skeleton" style="width:10px;height:10px;border-radius:50%;"></div><div class="skeleton" style="width:80px;height:14px;"></div></div>
      <div class="service-badge"><div class="skeleton" style="width:10px;height:10px;border-radius:50%;"></div><div class="skeleton" style="width:80px;height:14px;"></div></div>
    </div>

    <!-- ── 关键指标卡片 ── -->
    <div class="stats-grid" id="stats-grid">
      <!-- 骨架占位，数据加载后替换 -->
      <div class="stat-card">
        <div class="stat-icon blue"><span>📄</span></div>
        <div class="stat-body">
          <div class="stat-value skeleton" style="width:60px;height:28px;border-radius:4px;"></div>
          <div class="stat-label" style="margin-top:8px;">知识库文档</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green"><span>🔗</span></div>
        <div class="stat-body">
          <div class="stat-value skeleton" style="width:60px;height:28px;border-radius:4px;"></div>
          <div class="stat-label" style="margin-top:8px;">文档分块</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon orange"><span>🏢</span></div>
        <div class="stat-body">
          <div class="stat-value skeleton" style="width:60px;height:28px;border-radius:4px;"></div>
          <div class="stat-label" style="margin-top:8px;">活跃租户</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon purple"><span>💬</span></div>
        <div class="stat-body">
          <div class="stat-value skeleton" style="width:60px;height:28px;border-radius:4px;"></div>
          <div class="stat-label" style="margin-top:8px;">今日查询</div>
        </div>
      </div>
    </div>

    <!-- ── 中间行：文档状态分布 + 快速操作 ── -->
    <div class="mid-row">

      <!-- 文档处理状态图 -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">文档处理状态分布</div>
          <a href="./documents.html" class="link-btn" style="font-size:13px;">查看全部 →</a>
        </div>
        <div class="card-body doc-status-chart" id="doc-status-chart">
          <!-- 由 JS 填充 -->
          <div class="status-bars">
            <div style="color:var(--text-light);font-size:13px;">加载中...</div>
          </div>
        </div>
      </div>

      <!-- 快速操作面板 -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">快速操作</div>
        </div>
        <div class="card-body">
          <div class="quick-actions">

            <!-- 上传文档 -->
            <button class="quick-action-btn" onclick="window.location.href='./documents.html'">
              <div class="qa-icon" style="background:#dbeafe;">📤</div>
              <div class="qa-text">
                <div class="qa-title">上传知识库文档</div>
                <div class="qa-desc">支持 PDF / Word / Excel</div>
              </div>
              <span class="qa-arrow">›</span>
            </button>

            <!-- 租户管理 -->
            <button class="quick-action-btn" onclick="window.location.href='./tenants.html'">
              <div class="qa-icon" style="background:#d1fae5;">🏢</div>
              <div class="qa-text">
                <div class="qa-title">创建新租户</div>
                <div class="qa-desc">配置授权码 / 文档配额</div>
              </div>
              <span class="qa-arrow">›</span>
            </button>

            <!-- 系统监控 -->
            <button class="quick-action-btn" onclick="window.location.href='./monitor.html'">
              <div class="qa-icon" style="background:#fef3c7;">📡</div>
              <div class="qa-text">
                <div class="qa-title">系统监控</div>
                <div class="qa-desc">Grafana / Prometheus 面板</div>
              </div>
              <span class="qa-arrow">›</span>
            </button>

            <!-- 处理失败重试 -->
            <button class="quick-action-btn" id="btn-retry-failed">
              <div class="qa-icon" style="background:#fee2e2;">🔁</div>
              <div class="qa-text">
                <div class="qa-title">重试失败文档</div>
                <div class="qa-desc">批量重新解析 failed 文档</div>
              </div>
              <span class="qa-arrow">›</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- ── 最近上传文档列表 ── -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">最近上传文档</div>
        <a href="./documents.html" class="link-btn">查看全部 →</a>
      </div>
      <div class="card-body no-pad">
        <div class="table-wrap">
          <table id="recent-docs-table">
            <thead>
              <tr>
                <th>文件名</th>
                <th>状态</th>
                <th>分块数</th>
                <th>上传时间</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="recent-docs-tbody">
              <!-- 骨架占位 -->
              <tr>
                <td colspan="5">
                  <div style="padding:20px;text-align:center;color:var(--text-light);font-size:13px;">加载中...</div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </main>
</div>

<!-- Toast 容器 -->
<div id="toast-container"></div>

<!-- ══════════════════════════════════════════════════════════
     依赖脚本（按顺序加载）
══════════════════════════════════════════════════════════ -->
<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/api.js?v=2"></script>

<script>
/* ══════════════════════════════════════════════════════════
   dashboard.js — 仪表板页面逻辑
══════════════════════════════════════════════════════════ */

// ── 路由守卫：未登录或非管理员则跳转至登录页 ─────────────────
Auth.guardRoute(CONFIG.ROLE.ADMIN);

// ── DOM 引用 ──────────────────────────────────────────────────
const $statsGrid       = document.getElementById('stats-grid');
const $docStatusChart  = document.getElementById('doc-status-chart');
const $recentDocsTbody = document.getElementById('recent-docs-tbody');
const $serviceRow      = document.getElementById('service-status-row');
const $refreshTime     = document.getElementById('refresh-time');

// ── 初始化侧边栏用户信息 ──────────────────────────────────────
(function initUserInfo() {
  const user = Auth.getUser();
  if (!user) return;
  const name = user.username || '管理员';
  document.getElementById('sidebar-username').textContent = name;
  // 取用户名首字母作为头像
  document.getElementById('user-avatar-text').textContent = name.charAt(0).toUpperCase();
})();

// ── 退出登录 ──────────────────────────────────────────────────
document.getElementById('btn-logout').addEventListener('click', () => {
  Auth.logout();                                    // 清除本地存储并跳转登录
});

// ── 手动刷新按钮 ──────────────────────────────────────────────
document.getElementById('btn-refresh-data').addEventListener('click', loadDashboard);

// ── 重试失败文档按钮 ──────────────────────────────────────────
document.getElementById('btn-retry-failed').addEventListener('click', retryFailedDocs);

/* ────────────────────────────────────────────────────────────
   加载健康状态
──────────────────────────────────────────────────────────── */
async function loadHealth() {
  // 定义需要展示的服务列表，unknown 表示尚未检测
  const services = [
    { name: 'API 服务',    key: 'app',      icon: '⚙️' },
    { name: 'PostgreSQL',  key: 'postgres', icon: '🗄️' },
    { name: 'Milvus',      key: 'milvus',   icon: '🔍' },
    { name: 'Redis',       key: 'redis',    icon: '⚡' },
  ];

  try {
    const health = await API.system.health();       // 调用 /health 接口
    // 根据返回的 services 字段更新每个服务状态
    services.forEach(svc => {
      if (health.services) {
        const st = health.services[svc.key];
        svc.status = st === 'healthy' ? 'online' : st ? 'offline' : 'unknown';
        svc.statusText = st || '未知';
      } else {
        svc.status = health.status === 'ok' ? 'online' : 'offline';
        svc.statusText = health.status || '未知';
      }
    });
  } catch (e) {
    // 接口失败，所有服务标记为离线
    services.forEach(svc => { svc.status = 'offline'; svc.statusText = '无法连接'; });
  }

  // 渲染服务状态徽章
  $serviceRow.innerHTML = services.map(svc => `
    <div class="service-badge">
      <div class="service-dot ${svc.status}"></div>
      <div>
        <div class="service-name">${svc.icon} ${svc.name}</div>
        <div class="service-status">${svc.statusText || svc.status}</div>
      </div>
    </div>
  `).join('');
}

/* ────────────────────────────────────────────────────────────
   加载统计卡片与文档状态
──────────────────────────────────────────────────────────── */
async function loadStats() {
  try {
    // 并行拉取文档列表和租户列表；stats 单独容错，失败不影响其他卡片
    const [docResp, tenantResp] = await Promise.all([
      API.docs.list({ page: 1, page_size: 1 }),
      API.tenants.list(),
    ]);
    const statsResp = await (typeof API.docs.stats === 'function'
      ? API.docs.stats().catch(() => null)
      : Promise.resolve(null));

    const totalDocs    = docResp?.total    ?? 0;
    const totalChunks  = statsResp?.total_chunks ?? '-';
    const todayQueries = statsResp?.today_queries ?? '-';
    const totalTenants = (tenantResp?.tenants ?? tenantResp ?? []).length;

    // 渲染四个统计卡片
    $statsGrid.innerHTML = `
      <div class="stat-card">
        <div class="stat-icon blue">📄</div>
        <div class="stat-body">
          <div class="stat-value">${Utils.formatNumber(totalDocs)}</div>
          <div class="stat-label">知识库文档</div>
          <div class="stat-delta neutral">📁 已处理完成文档数</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green">🔗</div>
        <div class="stat-body">
          <div class="stat-value">${totalChunks === '-' ? '-' : Utils.formatNumber(totalChunks)}</div>
          <div class="stat-label">文档分块</div>
          <div class="stat-delta neutral">🧩 向量化存储总量</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon orange">🏢</div>
        <div class="stat-body">
          <div class="stat-value">${Utils.formatNumber(totalTenants)}</div>
          <div class="stat-label">活跃租户</div>
          <div class="stat-delta neutral">🔑 已注册机构数</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon purple">💬</div>
        <div class="stat-body">
          <div class="stat-value">${todayQueries === '-' ? '-' : Utils.formatNumber(todayQueries)}</div>
          <div class="stat-label">今日查询</div>
          <div class="stat-delta neutral">📈 今日问答请求数</div>
        </div>
      </div>
    `;

    // 统计文档各状态数量（需拉取全量或分状态查询）
    await loadDocStatusChart();

  } catch (e) {
    console.error('加载统计失败', e);
    Utils.toast('统计数据加载失败: ' + e.message, 'error');
  }
}

/* ────────────────────────────────────────────────────────────
   文档状态分布图
──────────────────────────────────────────────────────────── */
async function loadDocStatusChart() {
  // 分别查询各状态文档数量
  const statuses = [
    { key: 'completed', label: '已完成', color: '#059669' },
    { key: 'processing', label: '处理中', color: '#3b82f6' },
    { key: 'pending',   label: '等待中', color: '#d97706' },
    { key: 'failed',    label: '已失败', color: '#dc2626' },
  ];

  let counts = {};
  let totalAll = 0;

  try {
    // 并行查询各状态的文档数
    const results = await Promise.all(
      statuses.map(s => API.docs.list({ page: 1, page_size: 1, status_filter: s.key }))
    );
    statuses.forEach((s, i) => {
      counts[s.key] = results[i]?.total ?? 0;
      totalAll += counts[s.key];
    });
  } catch (e) {
    console.warn('状态图加载失败', e);
    totalAll = 0;
  }

  // 构建水平进度条
  $docStatusChart.innerHTML = `
    <div class="status-bars">
      ${statuses.map(s => {
        const cnt = counts[s.key] ?? 0;
        const pct = totalAll > 0 ? Math.round(cnt / totalAll * 100) : 0;
        return `
          <div class="status-bar-row">
            <div class="status-bar-label">${s.label}</div>
            <div class="status-bar-track">
              <div class="status-bar-fill" style="width:${pct}%;background:${s.color};"></div>
            </div>
            <div class="status-bar-count">${cnt}</div>
          </div>
        `;
      }).join('')}
      <div style="margin-top:12px;font-size:12px;color:var(--text-light);">
        共 <strong>${totalAll}</strong> 份文档
      </div>
    </div>
  `;
}

/* ────────────────────────────────────────────────────────────
   最近上传的文档列表
──────────────────────────────────────────────────────────── */
async function loadRecentDocs() {
  try {
    const resp = await API.docs.list({ page: 1, page_size: 8 }); // 最多显示 8 条
    const docs = resp?.documents ?? resp?.items ?? [];

    if (docs.length === 0) {
      // 空状态
      $recentDocsTbody.innerHTML = `
        <tr><td colspan="5">
          <div class="empty-state">
            <div class="empty-icon">📂</div>
            <div class="empty-text">暂无文档，请上传知识库文档</div>
          </div>
        </td></tr>
      `;
      return;
    }

    // 逐行渲染文档
    $recentDocsTbody.innerHTML = docs.map(doc => {
      const badge = Utils.docStatusBadge(doc.status);   // 获取状态徽章配置
      return `
        <tr>
          <td>
            <div class="file-name-cell">
              <span class="file-icon-sm">${Utils.fileIcon(doc.filename || doc.file_name || '')}</span>
              <div>
                <div class="file-name" title="${Utils.escapeHtml(doc.filename || doc.file_name || '-')}">
                  ${Utils.escapeHtml(doc.filename || doc.file_name || '-')}
                </div>
                <div class="file-size">${Utils.formatFileSize(doc.file_size || 0)}</div>
              </div>
            </div>
          </td>
          <td>
            <span class="badge ${badge.colorClass}">${badge.label}</span>
          </td>
          <td>${doc.chunk_count ?? '-'}</td>
          <td>${Utils.formatDate(doc.created_at, true)}</td>
          <td>
            <a href="./documents.html" class="link-btn">查看</a>
          </td>
        </tr>
      `;
    }).join('');

  } catch (e) {
    console.error('加载文档列表失败', e);
    $recentDocsTbody.innerHTML = `
      <tr><td colspan="5">
        <div class="empty-state">
          <div class="empty-text">⚠️ 加载失败：${Utils.escapeHtml(e.message)}</div>
        </div>
      </td></tr>
    `;
  }
}

/* ────────────────────────────────────────────────────────────
   批量重试失败文档
──────────────────────────────────────────────────────────── */
async function retryFailedDocs() {
  try {
    // 拉取 failed 状态文档（最多取 50 条）
    const resp = await API.docs.list({ page: 1, page_size: 50, status_filter: 'failed' });
    const failed = resp?.documents ?? resp?.items ?? [];
    if (failed.length === 0) {
      Utils.toast('暂无失败文档需要重试', 'success');
      return;
    }
    // 并行发起重试
    const results = await Promise.allSettled(failed.map(doc => API.docs.retry(doc.id || doc.doc_id)));
    const ok = results.filter(r => r.status === 'fulfilled').length;
    Utils.toast(`已提交 ${ok} 个文档重试，${results.length - ok} 个失败`, ok > 0 ? 'success' : 'error');
    // 重试后刷新数据
    await loadStats();
    await loadRecentDocs();
  } catch (e) {
    Utils.toast('批量重试失败: ' + e.message, 'error');
  }
}

/* ────────────────────────────────────────────────────────────
   主入口：加载仪表板所有数据
──────────────────────────────────────────────────────────── */
async function loadDashboard() {
  $refreshTime.textContent = new Date().toLocaleTimeString('zh-CN');
  // 并行加载各模块数据
  await Promise.all([
    loadHealth(),
    loadStats(),
    loadRecentDocs(),
  ]);
}

// 页面加载时自动执行
loadDashboard();
</script>
</body>
</html>
